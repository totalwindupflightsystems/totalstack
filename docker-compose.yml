services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    # build from the TotalStack Dockerfile — no published image yet
    build:
      context: .
      args:
        # setuptools_scm cannot detect a version inside the image (no .git in
        # build context); Dockerfile:142 needs it for SETUPTOOLS_SCM_PRETEND_VERSION.
        # Env-overridable; default mirrors bin/docker-helper.sh version derivation.
        LOCALSTACK_BUILD_VERSION: ${LOCALSTACK_BUILD_VERSION:-4.14.0.post701}
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
