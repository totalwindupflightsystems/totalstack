guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  test_on_clean: true
  test_timeout: 300
  test_command: .venv/bin/python -m pytest specs/aws/.speclang/assembled/_tests/ -x
    --tb=short -c /dev/null && .venv/bin/python -m pytest tests/aws/services/acm/
    --tb=short -q
  dead_code: false
  static_analysis: true
  lsp: true
  lsp_tools:
  - pylsp
evaluator:
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 4M
  max_output_tokens: 1M
  compaction_threshold: 0.90
  code_context_budget: 0.40
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
# guard verification run
